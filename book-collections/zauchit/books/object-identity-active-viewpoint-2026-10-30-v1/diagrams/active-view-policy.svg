<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#263846"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#438b80"/></marker>
    <style>
      .title { font: 700 34px 'DejaVu Sans', sans-serif; fill: #1c3040; }
      .box { fill: #173640; stroke: #4c8d83; stroke-width: 4; rx: 20; }
      .outcome { fill: #10232f; stroke: #b9985b; stroke-width: 4; rx: 18; }
      .diamond { fill: #332848; stroke: #d1aa59; stroke-width: 4; }
      .label { font: 600 21px 'DejaVu Sans', sans-serif; fill: #f6f3ea; text-anchor: middle; }
      .decision { font: 600 21px 'DejaVu Sans', sans-serif; fill: #fff3d6; text-anchor: middle; }
      .edge { fill: none; stroke: #263846; stroke-width: 4; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .edge-loop { fill: none; stroke: #438b80; stroke-width: 4; stroke-dasharray: 12 9; marker-end: url(#arrowTeal); stroke-linecap: round; stroke-linejoin: round; }
      .edge-label { font: 600 18px 'DejaVu Sans', sans-serif; fill: #263846; paint-order: stroke; stroke: #fff; stroke-width: 8px; stroke-linejoin: round; text-anchor: middle; }
      .note { font: 17px 'DejaVu Sans', sans-serif; fill: #52616b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1400" height="1000" fill="#fbfaf6"/>
  <text class="title" x="700" y="52" text-anchor="middle">Политика активного выбора вида</text>

  <!-- Flow connectors, behind nodes -->
  <path class="edge" d="M300 172 H350"/>
  <path class="edge" d="M560 172 H610"/>
  <path class="edge" d="M900 172 H985"/>
  <path class="edge" d="M1100 265 V386"/>
  <path class="edge" d="M1140 516 V536"/>
  <path class="edge" d="M1140 714 V816"/>
  <path class="edge" d="M1002 625 L900 625 L875 600"/>
  <path class="edge" d="M985 175 H950 V600 H875"/>
  <path class="edge-loop" d="M1027 665 H930 V315 H455 V245"/>

  <!-- Main sequence -->
  <rect class="box" x="55" y="105" width="245" height="135"/>
  <text class="label" x="178" y="160"><tspan x="178">Текущие кадры</tspan><tspan x="178" dy="36">неопределённость</tspan><tspan x="178" dy="36">same / new</tspan></text>

  <rect class="box" x="350" y="105" width="210" height="135"/>
  <text class="label" x="455" y="164"><tspan x="455">Кандидаты</tspan><tspan x="455" dy="38">ракурсов</tspan></text>

  <rect class="box" x="610" y="105" width="290" height="135"/>
  <text class="label" x="755" y="151"><tspan x="755">Ожидаемая</tspan><tspan x="755" dy="36">информация об ID</tspan><tspan x="755" dy="36">и цена действия</tspan></text>

  <polygon class="diamond" points="1100,75 1215,175 1100,275 985,175"/>
  <text class="decision" x="1100" y="166"><tspan x="1100">Оправдан ли</tspan><tspan x="1100" dy="34">новый вид?</tspan></text>

  <rect class="box" x="990" y="386" width="300" height="130"/>
  <text class="label" x="1140" y="438"><tspan x="1140">Запросить ракурс</tspan><tspan x="1140" dy="38">и обновить оценку</tspan></text>

  <polygon class="diamond" points="1140,536 1280,625 1140,714 1000,625"/>
  <text class="decision" x="1140" y="616"><tspan x="1140">Достаточно</tspan><tspan x="1140" dy="34">свидетельств?</tspan></text>

  <rect class="outcome" x="1020" y="816" width="240" height="92"/>
  <text class="label" x="1140" y="873">Ответ same / new</text>

  <rect class="outcome" x="575" y="535" width="300" height="130"/>
  <text class="label" x="725" y="590"><tspan x="725">Остановиться</tspan><tspan x="725" dy="38">или abstain</tspan></text>

  <!-- Branch labels -->
  <text class="edge-label" x="1170" y="333">да</text>
  <text class="edge-label" x="1175" y="778">да</text>
  <text class="edge-label" x="944" y="430">нет</text>
  <text class="edge-label" x="640" y="299">нет, но вид может помочь</text>
  <text class="edge-label" x="925" y="689">нет</text>

  <text class="note" x="700" y="964">Сравнения: пассивный вид, случайный выбор и cost-blind политика при равных сцене и бюджете.</text>
</svg>
