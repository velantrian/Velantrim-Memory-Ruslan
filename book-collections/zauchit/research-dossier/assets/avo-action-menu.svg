<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Меню активных ракурсов AVO</title>
  <desc id="desc">Схема от исходного наблюдения к выбору камеры-команды, единственному новому виду и ответу same, new или abstain. Относительные цены иллюстративны.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#159A9C"/></marker>
    <style>
      .navy{fill:#10253F}.teal{fill:#159A9C}.gold{fill:#D8A63C}.ink{fill:#17324D}.muted{fill:#5E7184}.line{stroke:#159A9C;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .card{fill:#FFFFFF;stroke:#D7E1E8;stroke-width:2}.soft{fill:#F3F7F9}.action{fill:#FFFFFF;stroke:#159A9C;stroke-width:2}.small{font:17px Arial,sans-serif}.body{font:20px Arial,sans-serif}.head{font:700 25px Arial,sans-serif}.title{font:700 31px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="460" fill="#F7FAFB"/>
  <text x="48" y="54" class="title ink">Активный выбор вида: наблюдение → действие → новый кадр</text>
  <text x="49" y="82" class="small muted">Иллюстративная схема меню; не результат и не спецификация финальных цен</text>
  <rect x="45" y="125" width="205" height="230" rx="18" class="card"/>
  <rect x="62" y="145" width="171" height="124" rx="12" class="soft"/>
  <path d="M100 245 C101 205 120 178 150 178 C181 178 198 202 198 245 Z" fill="#3B6B8C"/>
  <rect x="91" y="232" width="112" height="31" rx="10" fill="#C7D3DA"/>
  <path d="M113 232 L113 205 M132 232 L132 199 M151 232 L151 205" stroke="#D8A63C" stroke-width="5" stroke-linecap="round"/>
  <text x="147" y="297" text-anchor="middle" class="body ink">Стартовый вид</text>
  <text x="147" y="325" text-anchor="middle" class="small muted">same / new / ?</text>
  <path d="M250 240 L302 240" class="line"/>
  <rect x="310" y="113" width="448" height="256" rx="20" class="card"/>
  <text x="334" y="148" class="head ink">Выберите не более одной команды</text>
  <rect x="334" y="174" width="180" height="52" rx="12" class="action"/>
  <text x="350" y="197" class="body ink">HOLD</text><text x="350" y="217" class="small muted">(1, 0, 1)</text>
  <rect x="532" y="174" width="201" height="52" rx="12" class="action"/>
  <text x="548" y="197" class="body ink">LEFT / RIGHT</text><text x="548" y="217" class="small muted">(2, 1, 1)</text>
  <rect x="334" y="240" width="180" height="52" rx="12" class="action"/>
  <text x="350" y="263" class="body ink">OBLIQUE / HEIGHT</text><text x="350" y="283" class="small muted">(2, 1, 1)</text>
  <rect x="532" y="240" width="201" height="52" rx="12" class="action"/>
  <text x="548" y="263" class="body ink">ZOOM / REPEAT</text><text x="548" y="283" class="small muted">(1, 0, 1)</text>
  <rect x="334" y="306" width="399" height="43" rx="12" fill="#FFF7E5" stroke="#D8A63C" stroke-width="2"/>
  <text x="350" y="334" class="body ink">STOP / ABSTAIN — (0, 0, 0)</text>
  <path d="M758 240 L813 240" class="line"/>
  <rect x="822" y="125" width="170" height="230" rx="18" fill="#E9F6F5" stroke="#159A9C" stroke-width="2"/>
  <circle cx="907" cy="187" r="33" fill="#FFFFFF" stroke="#159A9C" stroke-width="3"/>
  <path d="M890 188 L902 200 L925 172" fill="none" stroke="#159A9C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="907" y="251" text-anchor="middle" class="body ink">Один новый</text>
  <text x="907" y="278" text-anchor="middle" class="body ink">вид, если выбран</text>
  <text x="907" y="317" text-anchor="middle" class="small muted">невыбранные ракурсы</text>
  <text x="907" y="339" text-anchor="middle" class="small muted">не раскрываются</text>
  <path d="M992 240 L1030 240" class="line"/>
  <rect x="1038" y="152" width="132" height="176" rx="18" fill="#10253F"/>
  <text x="1104" y="194" text-anchor="middle" class="body" fill="#FFFFFF">Ответ</text>
  <text x="1104" y="231" text-anchor="middle" class="head" fill="#FFFFFF">same</text>
  <text x="1104" y="265" text-anchor="middle" class="head" fill="#FFFFFF">new</text>
  <text x="1104" y="299" text-anchor="middle" class="head" fill="#D8A63C">abstain</text>
  <text x="48" y="419" class="small muted">Цена = (условное время, путь камеры, кадры). Все числа схематичны; для всех сцен максимум один ход и один пост-действийный кадр.</text>
</svg>
