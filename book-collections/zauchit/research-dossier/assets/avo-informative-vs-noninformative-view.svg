<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Информативный и неинформативный вид</title>
  <desc id="desc">Два схематичных варианта одного исходного кадра: боковой обзор может открыть индивидуальный знак, а повтор того же вида показывает только общий класс. Это объяснение логики, не экспериментальный результат.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#159A9C"/></marker>
    <style>
      .ink{fill:#17324D}.muted{fill:#5E7184}.panel{fill:#FFFFFF;stroke:#D7E1E8;stroke-width:2}.teal{fill:#159A9C}.gold{fill:#D8A63C}.arrow{stroke:#159A9C;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .title{font:700 30px Arial,sans-serif}.head{font:700 23px Arial,sans-serif}.body{font:19px Arial,sans-serif}.small{font:16px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#F7FAFB"/>
  <text x="48" y="52" class="title ink">Что меняет выбранный ракурс?</text>
  <text x="49" y="80" class="small muted">Два возможных исхода одной активной проверки; схема не сообщает, что какой-либо тест был проведён</text>
  <rect x="42" y="112" width="536" height="330" rx="20" class="panel"/>
  <rect x="622" y="112" width="536" height="330" rx="20" class="panel"/>
  <rect x="64" y="132" width="205" height="38" rx="18" fill="#E7F5F4"/>
  <text x="166" y="158" text-anchor="middle" class="small ink">ВИД СБОКУ</text>
  <rect x="644" y="132" width="205" height="38" rx="18" fill="#FFF5DE"/>
  <text x="746" y="158" text-anchor="middle" class="small ink">ТОТ ЖЕ ВИД</text>
  <!-- informative panel -->
  <path d="M114 294 C114 229 147 192 201 192 C254 192 287 231 287 294 Z" fill="#3B6B8C"/>
  <rect x="96" y="287" width="210" height="28" rx="12" fill="#C7D3DA"/>
  <rect x="244" y="219" width="38" height="55" rx="5" fill="#F7FAFB" stroke="#10253F" stroke-width="2"/>
  <circle cx="253" cy="232" r="3.4" fill="#D8A63C"/><circle cx="270" cy="232" r="3.4" fill="#D8A63C"/><circle cx="261.5" cy="248" r="3.4" fill="#D8A63C"/>
  <path d="M320 252 C355 218 377 218 403 239" class="arrow"/>
  <text x="348" y="211" text-anchor="middle" class="small muted">обход камеры</text>
  <rect x="410" y="192" width="136" height="106" rx="16" fill="#E9F6F5" stroke="#159A9C" stroke-width="2"/>
  <text x="478" y="224" text-anchor="middle" class="body ink">виден</text>
  <text x="478" y="250" text-anchor="middle" class="body ink">личный знак</text>
  <text x="478" y="279" text-anchor="middle" class="small muted">сравнить с референсом</text>
  <text x="70" y="354" class="head ink">Новый кадр может различить экземпляры</text>
  <text x="70" y="385" class="small muted">Считать доказательством только видимый cue об identity,</text>
  <text x="70" y="407" class="small muted">а не сам факт движения камеры или смены силуэта.</text>
  <!-- non-informative panel -->
  <path d="M691 294 C691 229 724 192 778 192 C831 192 864 231 864 294 Z" fill="#3B6B8C"/>
  <rect x="673" y="287" width="210" height="28" rx="12" fill="#C7D3DA"/>
  <rect x="828" y="217" width="24" height="48" rx="10" fill="#F7FAFB" stroke="#10253F" stroke-width="2"/>
  <path d="M904 239 L958 239" class="arrow"/>
  <text x="930" y="219" text-anchor="middle" class="small muted">повтор</text>
  <rect x="967" y="192" width="152" height="106" rx="16" fill="#FFF7E5" stroke="#D8A63C" stroke-width="2"/>
  <text x="1043" y="224" text-anchor="middle" class="body ink">тот же</text>
  <text x="1043" y="250" text-anchor="middle" class="body ink">класс / кадр</text>
  <text x="1043" y="279" text-anchor="middle" class="small muted">identity не разрешена</text>
  <text x="650" y="354" class="head ink">Движение может не добавить нужной информации</text>
  <text x="650" y="385" class="small muted">Повтор, категорийный cue и общий силуэт</text>
  <text x="650" y="407" class="small muted">не превращаются автоматически в same/new evidence.</text>
  <rect x="42" y="462" width="1116" height="36" rx="12" fill="#10253F"/>
  <text x="600" y="486" text-anchor="middle" font="700 16px Arial,sans-serif" fill="#FFFFFF">Объяснительная схема · не данные, не прогноз и не результат испытания</text>
</svg>
