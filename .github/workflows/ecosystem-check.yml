name: Ecosystem check

# Проверка источников реестра projects/ecosystem.json. Только чтение: ничего не коммитит,
# не создаёт PR, issues и уведомлений, не использует секреты и платные API.
# Результат — раздел Summary запуска и артефакты (отчёт и предлагаемый baseline).
#
# Сейчас запускается ТОЛЬКО вручную (Actions → Ecosystem check → Run workflow).
# Расписание подготовлено, но выключено: чтобы включить его после успешной ручной проверки,
# раскомментируйте блок schedule ниже (см. tools/ecosystem/README.md).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check — сравнить источники с baseline; validate — только проверить реестр и сформированные файлы"
        type: choice
        options:
          - check
          - validate
        default: check
  # schedule:
  #   - cron: "17 6 * * 1"  # раз в неделю, понедельник 06:17 UTC

permissions:
  contents: read

concurrency:
  group: ecosystem-check
  cancel-in-progress: false

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Тесты скрипта
        run: python3 -I -m unittest discover -s tools/ecosystem

      - name: Реестр и сформированные файлы
        run: |
          python3 tools/ecosystem/ecosystem.py validate
          python3 tools/ecosystem/ecosystem.py render --check

      - name: Проверка источников
        if: ${{ inputs.mode != 'validate' }}
        env:
          # встроенный токен запуска: даёт только чтение публичных данных; нового секрета не требуется
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/ecosystem/ecosystem.py check \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json ecosystem-report.json \
            --propose proposed-baseline.json
          code=$?
          if [ "$code" -eq 10 ]; then
            echo "::notice::Ecosystem: есть изменения для рассмотрения (см. Summary). Реестр не менялся."
            exit 0
          fi
          exit "$code"

      - name: Артефакты
        if: ${{ always() && inputs.mode != 'validate' }}
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-check
          path: |
            ecosystem-report.json
            proposed-baseline.json
          if-no-files-found: ignore
