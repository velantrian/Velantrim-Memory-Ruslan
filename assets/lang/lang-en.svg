<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48" role="img" aria-label="English">
  <title>English</title>
  <defs>
    <linearGradient id="gena" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7a5c12"/><stop offset="22%" stop-color="#c9a227"/><stop offset="45%" stop-color="#fff3b0"/><stop offset="60%" stop-color="#f5d76e"/><stop offset="80%" stop-color="#c9a227"/><stop offset="100%" stop-color="#8a6d1d"/></linearGradient>
    <filter id="shena" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glowena" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g opacity="1">
    <text x="110" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', 'Noto Serif', serif" font-size="25" font-weight="700" letter-spacing="2" fill="url(#gena)" stroke="#3b2a05" stroke-width="0.8" paint-order="stroke" filter="url(#shena)">[ ENGLISH ]</text>
    <rect x="30" y="41" width="160" height="2.5" rx="1.25" fill="url(#gena)" filter="url(#glowena)"/>
  </g>
</svg>
