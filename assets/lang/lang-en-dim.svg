<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48" role="img" aria-label="English">
  <title>English</title>
  <defs>
    <linearGradient id="gend" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5e4a1a"/><stop offset="30%" stop-color="#8f7a3e"/><stop offset="50%" stop-color="#c8b77a"/><stop offset="70%" stop-color="#8f7a3e"/><stop offset="100%" stop-color="#5e4a1a"/></linearGradient>
    <filter id="shend" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glowend" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g opacity="0.72">
    <text x="110" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', 'Noto Serif', serif" font-size="25" font-weight="700" letter-spacing="2" fill="url(#gend)" stroke="#3b2a05" stroke-width="0.8" paint-order="stroke" filter="url(#shend)">[ ENGLISH ]</text>
    
  </g>
</svg>
