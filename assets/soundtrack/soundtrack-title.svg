<svg xmlns="http://www.w3.org/2000/svg" width="600" height="90" viewBox="0 0 600 90" role="img" aria-label="🎵 Velantrim — Soundtrack">
  <title>🎵 Velantrim — Soundtrack</title>
  <defs>
    <!-- metallic gold (same palette as the language switcher) -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5c12"/>
      <stop offset="22%" stop-color="#c9a227"/>
      <stop offset="45%" stop-color="#fff3b0"/>
      <stop offset="60%" stop-color="#f5d76e"/>
      <stop offset="80%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6d1d"/>
    </linearGradient>
    <!-- gunmetal / steel-blue metal for the note -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="35%" stop-color="#4a6585"/>
      <stop offset="47%" stop-color="#c9d6e3"/>
      <stop offset="58%" stop-color="#5d7a99"/>
      <stop offset="100%" stop-color="#1e2b3a"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#c9d6e3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 3D bevel: specular lighting on the alpha bump + drop shadow -->
    <filter id="bevel3d" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="0.9" specularExponent="30" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="225" elevation="42"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.45" k4="0" result="lit"/>
      <feDropShadow dx="3" dy="4" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="goldfx" x="-3%" y="-30%" width="108%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="0.8" specularExponent="18" lighting-color="#fff6d0" result="spec">
        <feDistantLight azimuth="235" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0" result="lit"/>
      <feDropShadow dx="2" dy="3" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 3D beamed music note -->
  <g filter="url(#bevel3d)">
    <g fill="url(#steel)" stroke="#0e1620" stroke-width="1.2">
      <path d="M30 22 L74 12 L74 24 L30 34 Z"/>
      <rect x="30" y="24" width="7" height="44" rx="2"/>
      <rect x="67" y="14" width="7" height="44" rx="2"/>
      <ellipse cx="25" cy="68" rx="12" ry="8.5" transform="rotate(-22 25 68)"/>
      <ellipse cx="62" cy="58" rx="12" ry="8.5" transform="rotate(-22 62 58)"/>
    </g>
    <!-- specular highlights -->
    <ellipse cx="21" cy="64.5" rx="4.5" ry="2.2" transform="rotate(-22 21 64.5)" fill="url(#spec)"/>
    <ellipse cx="58" cy="54.5" rx="4.5" ry="2.2" transform="rotate(-22 58 54.5)" fill="url(#spec)"/>
    <path d="M33 23.5 L71 15 L71 18 L33 26.5 Z" fill="url(#gloss)"/>
    <rect x="31.5" y="27" width="2" height="36" rx="1" fill="#e6eef6" opacity="0.35"/>
    <rect x="68.5" y="17" width="2" height="36" rx="1" fill="#e6eef6" opacity="0.35"/>
  </g>

  <!-- gold title -->
  <text x="100" y="58" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', 'Noto Serif', serif" font-size="39" font-weight="700" letter-spacing="1.5" fill="url(#gold)" stroke="#3b2a05" stroke-width="1" paint-order="stroke" filter="url(#goldfx)">Velantrim — Soundtrack</text>
  <rect x="102" y="70" width="456" height="2.5" rx="1.25" fill="url(#gold)" opacity="0.85"/>
</svg>
