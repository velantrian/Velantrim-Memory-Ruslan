<rect x="68" y="183" width="230" height="84" rx="13" fill="#ffffff" stroke="#74bba5" stroke-width="1.4"/><text x="85" y="211" fill="#162b47" font-size="19" font-weight="700">Сенсоры и тело</text><text x="85" y="232" fill="#475569" font-size="13">Зрение, звук, прикосновение</text><text x="85" y="249" fill="#475569" font-size="13">и состояние среды</text>
