<rect x="390" y="983" width="310" height="76" rx="13" fill="#ffffff" stroke="#af96d5" stroke-width="1.4"/><text x="407" y="1011" fill="#162b47" font-size="19" font-weight="700">Язык</text><text x="407" y="1032" fill="#475569" font-size="13">Смыслы, общение, объяснения</text>
<rect x="1020" y="983" width="585" height="76" rx="13" fill="#ffffff" stroke="#af96d5" stroke-width="1.4"/><text x="1037" y="1011" fill="#162b47" font-size="19" font-weight="700">Совместное понимание</text><text x="1037" y="1032" fill="#475569" font-size="13">Общая история не отменяет отдельности целей и решений</text>
