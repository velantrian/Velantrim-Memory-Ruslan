<text x="850" y="50" text-anchor="middle" fill="#142a45" font-size="36" font-weight="800">Карта разума: что связано с «Я»?</text>
<text x="850" y="80" text-anchor="middle" fill="#52677e" font-size="18">Velantrim · когнитивные механизмы и открытый вопрос субъективности · 19.10.2026</text>
<rect x="45" y="100" width="520" height="375" rx="25" fill="#eef9f2" stroke="#c4e6d2" stroke-width="2"/><text x="69" y="139" fill="#173354" font-size="26" font-weight="700">Восприятие и мир</text><text x="69" y="165" fill="#475569" font-size="15">Как система узнаёт, что происходит снаружи</text>
<rect x="1135" y="100" width="520" height="375" rx="25" fill="#eef6ff" stroke="#c2d9f7" stroke-width="2"/><text x="1159" y="139" fill="#173354" font-size="26" font-weight="700">Мышление и познание</text><text x="1159" y="165" fill="#475569" font-size="15">Как возникают объяснения и новые идеи</text>
<rect x="45" y="520" width="520" height="360" rx="25" fill="#fff0f5" stroke="#f4ccda" stroke-width="2"/><text x="69" y="559" fill="#173354" font-size="26" font-weight="700">Память и обучение</text><text x="69" y="585" fill="#475569" font-size="15">Как прошлое влияет на следующие решения</text>
<rect x="1135" y="520" width="520" height="360" rx="25" fill="#fff8eb" stroke="#f2ddba" stroke-width="2"/><text x="1159" y="559" fill="#173354" font-size="26" font-weight="700">Мотивация и деятельность</text><text x="1159" y="585" fill="#475569" font-size="15">Почему что-то становится значимым</text>
<rect x="45" y="920" width="1610" height="158" rx="25" fill="#f7f2ff" stroke="#dfd0f4" stroke-width="2"/><text x="69" y="959" fill="#173354" font-size="26" font-weight="700">Общение и совместная жизнь</text><text x="69" y="985" fill="#475569" font-size="15">Язык, отношения, культура и сотрудничество</text>
