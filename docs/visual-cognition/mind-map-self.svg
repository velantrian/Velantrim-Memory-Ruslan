<text x="850" y="392" text-anchor="middle" font-size="36">✦</text>
<text x="850" y="458" text-anchor="middle" fill="#1f4283" font-size="86" font-weight="800">Я</text>
<text x="850" y="495" text-anchor="middle" fill="#213e61" font-size="18" font-weight="600">Субъективная перспектива</text>
<text x="850" y="523" text-anchor="middle" fill="#213e61" font-size="18" font-weight="600">ощущение принадлежности опыта</text>
<text x="850" y="551" text-anchor="middle" fill="#213e61" font-size="18" font-weight="600">и непрерывности себя</text>
<rect x="622" y="666" rx="15" width="456" height="68" fill="#fff1f2" stroke="#e76875" stroke-width="2"/>
<text x="850" y="692" text-anchor="middle" fill="#ad2441" font-size="19" font-weight="800">Мы пока НЕ знаем, как создать</text>
<text x="850" y="719" text-anchor="middle" fill="#ad2441" font-size="19" font-weight="800">подлинное субъективное «Я»</text>
<rect x="642" y="759" rx="14" width="416" height="98" fill="#e7f7f1" stroke="#63b69e" stroke-width="2"/>
<text x="850" y="790" text-anchor="middle" fill="#17634f" font-size="22" font-weight="800">Самомодель ≠ субъективное «Я»</text>
<text x="850" y="814" text-anchor="middle" fill="#235d53" font-size="16">Знание своих границ, способностей,</text>
<text x="850" y="837" text-anchor="middle" fill="#235d53" font-size="16">состояния и истории — проверяемая функция</text>
<text x="850" y="1015" text-anchor="middle" fill="#4e2c7f" font-size="19" font-weight="800">Связи между процессами — исследовательские гипотезы</text>
<text x="850" y="1045" text-anchor="middle" fill="#5b5172" font-size="14">Ни один отдельный механизм и их сумма пока не доказывают появления субъективного опыта.</text>
</svg>