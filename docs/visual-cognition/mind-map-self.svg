<rect x="68" y="289" width="230" height="84" rx="13" fill="#ffffff" stroke="#74bba5" stroke-width="1.4"/><text x="85" y="317" fill="#162b47" font-size="19" font-weight="700">Внимание</text><text x="85" y="338" fill="#475569" font-size="13">Выбор значимого</text><text x="85" y="355" fill="#475569" font-size="13">среди множества сигналов</text>
<rect x="311" y="289" width="230" height="84" rx="13" fill="#ffffff" stroke="#74bba5" stroke-width="1.4"/><text x="328" y="317" fill="#162b47" font-size="19" font-weight="700">Модель мира</text><text x="328" y="338" fill="#475569" font-size="13">Объекты, причинность,</text><text x="328" y="355" fill="#475569" font-size="13">пространство и время</text>
<rect x="1158" y="183" width="230" height="84" rx="13" fill="#ffffff" stroke="#87b4e0" stroke-width="1.4"/><text x="1175" y="211" fill="#162b47" font-size="19" font-weight="700">Мышление</text><text x="1175" y="232" fill="#475569" font-size="13">Анализ, выводы,</text><text x="1175" y="249" fill="#475569" font-size="13">связывание смыслов</text>
<rect x="1400" y="183" width="230" height="84" rx="13" fill="#ffffff" stroke="#87b4e0" stroke-width="1.4"/><text x="1417" y="211" fill="#162b47" font-size="19" font-weight="700">Планирование</text><text x="1417" y="232" fill="#475569" font-size="13">Выбор шагов и прогноз</text><text x="1417" y="249" fill="#475569" font-size="13">последствий</text>
<rect x="1158" y="289" width="230" height="84" rx="13" fill="#ffffff" stroke="#87b4e0" stroke-width="1.4"/><text x="1175" y="317" fill="#162b47" font-size="19" font-weight="700">Творчество и инсайт</text><text x="1175" y="338" fill="#475569" font-size="13">Новые гипотезы</text><text x="1175" y="355" fill="#475569" font-size="13">и неожиданные связи</text>
<rect x="1400" y="289" width="230" height="84" rx="13" fill="#ffffff" stroke="#87b4e0" stroke-width="1.4"/><text x="1417" y="317" fill="#162b47" font-size="19" font-weight="700">Противоречия</text><text x="1417" y="338" fill="#475569" font-size="13">Проверка ошибок,</text><text x="1417" y="355" fill="#475569" font-size="13">несогласий и оснований</text>
<rect x="1280" y="389" width="230" height="60" rx="13" fill="#ffffff" stroke="#87b4e0" stroke-width="1.4"/><text x="1297" y="417" fill="#162b47" font-size="19" font-weight="700">Метапознание</text><text x="1297" y="438" fill="#475569" font-size="13">Что знаю и чего не знаю</text>
<rect x="68" y="600" width="230" height="84" rx="13" fill="#ffffff" stroke="#e3a6bb" stroke-width="1.4"/><text x="85" y="628" fill="#162b47" font-size="19" font-weight="700">Память</text><text x="85" y="649" fill="#475569" font-size="13">Эпизоды, факты,</text><text x="85" y="666" fill="#475569" font-size="13">навыки, история</text>
<rect x="311" y="600" width="230" height="84" rx="13" fill="#ffffff" stroke="#e3a6bb" stroke-width="1.4"/><text x="328" y="628" fill="#162b47" font-size="19" font-weight="700">Умное забывание</text><text x="328" y="649" fill="#475569" font-size="13">Сохранение важного,</text><text x="328" y="666" fill="#475569" font-size="13">ослабление лишнего</text>
<rect x="68" y="708" width="230" height="84" rx="13" fill="#ffffff" stroke="#e3a6bb" stroke-width="1.4"/><text x="85" y="736" fill="#162b47" font-size="19" font-weight="700">Обучение</text><text x="85" y="757" fill="#475569" font-size="13">Изменение будущего</text><text x="85" y="774" fill="#475569" font-size="13">поведения из опыта</text>
<rect x="311" y="708" width="230" height="84" rx="13" fill="#ffffff" stroke="#e3a6bb" stroke-width="1.4"/><text x="328" y="736" fill="#162b47" font-size="19" font-weight="700">Непрерывность</text><text x="328" y="757" fill="#475569" font-size="13">Связь прошлого,</text><text x="328" y="774" fill="#475569" font-size="13">настоящего и будущего</text>
<rect x="1158" y="600" width="230" height="84" rx="13" fill="#ffffff" stroke="#e8bb7a" stroke-width="1.4"/><text x="1175" y="628" fill="#162b47" font-size="19" font-weight="700">Цели и мотивация</text><text x="1175" y="649" fill="#475569" font-size="13">Что важно, зачем</text><text x="1175" y="666" fill="#475569" font-size="13">стремиться к результату</text>
<rect x="1400" y="600" width="230" height="84" rx="13" fill="#ffffff" stroke="#e8bb7a" stroke-width="1.4"/><text x="1417" y="628" fill="#162b47" font-size="19" font-weight="700">Эмоции и оценка</text><text x="1417" y="649" fill="#475569" font-size="13">Значимость и внутренние</text><text x="1417" y="666" fill="#475569" font-size="13">функциональные состояния</text>
<rect x="1158" y="708" width="230" height="84" rx="13" fill="#ffffff" stroke="#e8bb7a" stroke-width="1.4"/><text x="1175" y="736" fill="#162b47" font-size="19" font-weight="700">Действие</text><text x="1175" y="757" fill="#475569" font-size="13">Воздействие на мир,</text><text x="1175" y="774" fill="#475569" font-size="13">проверка ожиданий</text>
<rect x="1400" y="708" width="230" height="84" rx="13" fill="#ffffff" stroke="#e8bb7a" stroke-width="1.4"/><text x="1417" y="736" fill="#162b47" font-size="19" font-weight="700">Инициатива</text><text x="1417" y="757" fill="#475569" font-size="13">Самостоятельный поиск</text><text x="1417" y="774" fill="#475569" font-size="13">вопросов и альтернатив</text>
